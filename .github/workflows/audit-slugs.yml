name: Audit migrated slugs

on:
  push:
    paths:
      - ".github/workflows/audit-slugs.yml"

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Compare Blogger slugs with Astro files
        run: |
          python - <<'PY'
          import re, unicodedata, urllib.request, xml.etree.ElementTree as ET
          from pathlib import Path

          FEED='https://vitacerta.blogspot.com/feeds/posts/default?alt=atom&max-results=500'
          NS={'a':'http://www.w3.org/2005/Atom'}
          def slugify(s):
              s=unicodedata.normalize('NFKD',s).encode('ascii','ignore').decode().lower()
              return re.sub(r'[^a-z0-9]+','-',s).strip('-')[:90] or 'artigo'

          raw=urllib.request.urlopen(urllib.request.Request(FEED,headers={'User-Agent':'VitaCerta-Slug-Audit/1.0'}),timeout=30).read()
          root=ET.fromstring(raw)
          expected=[]
          seen=set()
          for e in root.findall('a:entry',NS):
              title=(e.findtext('a:title',default='',namespaces=NS) or '').strip()
              body=(e.findtext('a:content',default='',namespaces=NS) or '').strip()
              if not title or not body: continue
              cats=[c.attrib.get('term','') for c in e.findall('a:category',NS)]
              kind=[c for c in cats if c.startswith('http://schemas.google.com/blogger/2008/kind#')]
              if kind and not any(c.endswith('#post') for c in kind): continue
              key=re.sub(r'\s+',' ',title).casefold()
              if key in seen: continue
              seen.add(key)
              expected.append(slugify(title))

          actual=sorted(p.stem for p in Path('src/content/posts/migrados').glob('*.md'))
          exp=sorted(set(expected))
          missing=sorted(set(exp)-set(actual))
          extra=sorted(set(actual)-set(exp))
          print(f'EXPECTED={len(exp)}')
          print(f'ACTUAL={len(actual)}')
          print(f'MISSING={len(missing)}')
          for s in missing: print('MISSING_SLUG='+s)
          print(f'EXTRA={len(extra)}')
          for s in extra: print('EXTRA_SLUG='+s)
          if missing or extra or len(exp)!=len(actual):
              raise SystemExit(1)
          print('SLUG_AUDIT=PASS')
          PY
