name: Deploy VitaCerta production

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "astro.config.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITE_SANITY_PROJECT_ID: 1dh7sg5j
      VITE_SANITY_DATASET: production
      SANITY_PREVIEW: "false"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Install dependencies
        run: npm ci
      - name: Build production
        run: npm run build
      - name: Prepare technical GitHub Pages path
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          base = '/VitaCerta-Astro'

          for p in Path('dist').rglob('*.html'):
              s = p.read_text(encoding='utf-8')
              if '<head>' in s and 'name="robots"' not in s:
                  s = s.replace('<head>', '<head><meta name="robots" content="noindex,nofollow">', 1)
              s = re.sub(r'((?:href|src)=["\'])/(?!/)', rf'\1{base}/', s)
              p.write_text(s, encoding='utf-8')

          for p in Path('dist').rglob('*.css'):
              s = p.read_text(encoding='utf-8')
              s = re.sub(r'url\((["\']?)/(?!/)', rf'url(\1{base}/', s)
              p.write_text(s, encoding='utf-8')
          PY
      - name: Verify technical Pages paths
        run: |
          grep -q '/VitaCerta-Astro/_astro/' dist/index.html
          grep -q 'noindex,nofollow' dist/index.html
          test "$(find dist/conteudos -type f -name index.html | wc -l)" -eq 86
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
