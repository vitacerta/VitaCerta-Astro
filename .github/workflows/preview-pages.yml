name: Build preview Astro

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/preview-pages.yml"

jobs:
  preview:
    runs-on: ubuntu-latest
    env:
      VITE_SANITY_PROJECT_ID: 1dh7sg5j
      VITE_SANITY_DATASET: production
      SANITY_PREVIEW: "true"
      SANITY_AUTH_TOKEN: ${{ secrets.SANITY_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
      - name: Verify preview credential
        run: |
          test -n "$SANITY_AUTH_TOKEN"
      - run: npm ci
      - run: npm run build
      - name: Prepare isolated project preview
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          base = '/VitaCerta-Astro'
          for p in Path('dist').rglob('*.html'):
              s = p.read_text(encoding='utf-8')
              if '<head>' in s and 'name="robots"' not in s:
                  s = s.replace('<head>', '<head><meta name="robots" content="noindex,nofollow">', 1)
              s = re.sub(r'((?:href|src)=["\'])/(?!/)', rf'\1{base}/', s)
              p.write_text(s, encoding='utf-8')
          for p in Path('dist').rglob('*.css'):
              s = p.read_text(encoding='utf-8')
              s = re.sub(r'url\((["\']?)/(?!/)', rf'url(\1{base}/', s)
              p.write_text(s, encoding='utf-8')
          PY
      - name: Validate all 86 VitaCerta articles
        run: |
          python - <<'PY'
          import json, html, sys
          from pathlib import Path

          rows = json.loads(Path('migration/vitacerta-posts.json').read_text(encoding='utf-8'))
          if len(rows) != 86:
              raise SystemExit(f'Manifesto inesperado: {len(rows)} artigos')

          required_pages = [
              Path('dist/index.html'),
              Path('dist/pt-BR/index.html'),
              Path('dist/pt-BR/blog/index.html'),
              Path('dist/pt-BR/blog/saude/index.html'),
              Path('dist/pt-BR/blog/nutricao/index.html'),
              Path('dist/pt-BR/blog/movimento/index.html'),
              Path('dist/pt-BR/blog/mente/index.html'),
              Path('dist/pt-BR/blog/longevidade/index.html'),
          ]
          for p in required_pages:
              if not p.is_file():
                  raise SystemExit(f'Pagina obrigatoria ausente: {p}')

          missing = []
          title_mismatch = []
          too_small = []
          for row in rows:
              slug = row['slug']
              p = Path('dist/pt-BR/blog') / slug / 'index.html'
              if not p.is_file():
                  missing.append(slug)
                  continue
              text = p.read_text(encoding='utf-8')
              title = row['title']
              if title not in text and html.escape(title, quote=False) not in text:
                  title_mismatch.append(slug)
              if len(text) < 3000:
                  too_small.append(slug)

          if missing or title_mismatch or too_small:
              print('missing=', missing)
              print('title_mismatch=', title_mismatch)
              print('too_small=', too_small)
              raise SystemExit('Falha na validacao dos artigos')

          root = Path('dist/index.html').read_text(encoding='utf-8')
          if 'noindex,nofollow' not in root:
              raise SystemExit('Preview sem noindex')

          print(f'VALIDADO: {len(rows)} artigos, home, listagem e 5 categorias')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: vitacerta-astro-preview-86
          path: dist
          retention-days: 3
