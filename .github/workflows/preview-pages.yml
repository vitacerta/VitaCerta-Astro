name: Build preview Astro

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/preview-pages.yml"
      - "src/**"
      - "migration/**"

jobs:
  preview:
    runs-on: ubuntu-latest
    env:
      VITE_SANITY_PROJECT_ID: 1dh7sg5j
      VITE_SANITY_DATASET: production
      SANITY_PREVIEW: "true"
      SANITY_AUTH_TOKEN: ${{ secrets.SANITY_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
      - name: Verify preview credential
        run: |
          test -n "$SANITY_AUTH_TOKEN"
      - run: npm ci
      - run: npm run build
      - name: Prepare isolated project preview
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          base = '/VitaCerta-Astro'
          for p in Path('dist').rglob('*.html'):
              s = p.read_text(encoding='utf-8')
              if '<head>' in s and 'name="robots"' not in s:
                  s = s.replace('<head>', '<head><meta name="robots" content="noindex,nofollow">', 1)
              s = re.sub(r'((?:href|src)=["\'])/(?!/)', rf'\1{base}/', s)
              p.write_text(s, encoding='utf-8')
          for p in Path('dist').rglob('*.css'):
              s = p.read_text(encoding='utf-8')
              s = re.sub(r'url\((["\']?)/(?!/)', rf'url(\1{base}/', s)
              p.write_text(s, encoding='utf-8')
          PY
      - name: Validate all 86 VitaCerta articles and SEO
        run: |
          python - <<'PY'
          import json, html
          from pathlib import Path

          rows = json.loads(Path('migration/vitacerta-posts.json').read_text(encoding='utf-8'))
          if len(rows) != 86:
              raise SystemExit(f'Manifesto inesperado: {len(rows)} artigos')

          required_pages = [
              Path('dist/index.html'),
              Path('dist/pt-BR/index.html'),
              Path('dist/pt-BR/blog/index.html'),
              Path('dist/pt-BR/blog/saude/index.html'),
              Path('dist/pt-BR/blog/nutricao/index.html'),
              Path('dist/pt-BR/blog/movimento/index.html'),
              Path('dist/pt-BR/blog/mente/index.html'),
              Path('dist/pt-BR/blog/longevidade/index.html'),
              Path('dist/rss.xml'),
              Path('dist/sitemap-index.xml'),
          ]
          for p in required_pages:
              if not p.is_file():
                  raise SystemExit(f'Pagina obrigatoria ausente: {p}')

          missing = []
          title_mismatch = []
          too_small = []
          legacy_routes = []
          canonical_problems = []
          lang_problems = []

          html_pages = []
          html_by_path = {}
          for hp in Path('dist').rglob('*.html'):
              page_text = hp.read_text(encoding='utf-8')
              html_pages.append(page_text)
              html_by_path[str(hp)] = page_text
          all_html = '\n'.join(html_pages)

          sitemap_text = '\n'.join(
              p.read_text(encoding='utf-8')
              for p in Path('dist').glob('sitemap*.xml')
          )
          rss_text = Path('dist/rss.xml').read_text(encoding='utf-8')

          old_internal_links = []
          sitemap_missing = []
          rss_missing = []

          for row in rows:
              slug = row['slug']
              p = Path('dist/conteudos') / slug / 'index.html'
              if not p.is_file():
                  missing.append(slug)
                  continue

              text = p.read_text(encoding='utf-8')
              title = row['title']
              escaped_title = html.escape(title, quote=True)
              if title not in text and escaped_title not in text:
                  title_mismatch.append(slug)
              if len(text) < 3000:
                  too_small.append(slug)

              old = Path('dist/pt-BR/blog') / slug / 'index.html'
              if old.is_file():
                  legacy_routes.append(slug)

              expected = f'https://vitacerta.com.br/conteudos/{slug}/'
              if 'rel="canonical"' not in text or expected not in text:
                  canonical_problems.append(slug)
              if '<html lang="pt-BR">' not in text:
                  lang_problems.append(slug)

              needle = f'/pt-BR/blog/{slug}'
              if needle in all_html:
                  old_internal_links.append(slug)
              if expected not in sitemap_text:
                  sitemap_missing.append(slug)
              if f'/conteudos/{slug}/' not in rss_text:
                  rss_missing.append(slug)

          problems = {
              'missing': missing,
              'title_mismatch': title_mismatch,
              'too_small': too_small,
              'legacy_routes': legacy_routes,
              'canonical_problems': canonical_problems,
              'lang_problems': lang_problems,
              'old_internal_links': old_internal_links,
              'sitemap_missing': sitemap_missing,
              'rss_missing': rss_missing,
          }
          if any(problems.values()):
              for key, value in problems.items():
                  print(f'{key}=', value)
              raise SystemExit('Falha na validacao dos artigos/SEO')

          root = Path('dist/index.html').read_text(encoding='utf-8')
          if 'noindex,nofollow' not in root:
              raise SystemExit('Preview sem noindex')

          print(f'SEO_OK: {len(rows)} artigos em /conteudos/ com canonical, pt-BR, sitemap e RSS; rota e links antigos ausentes')
          PY
      - name: Audit all published articles against canonical migration source
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs'
          import path from 'node:path'
          import {createClient} from '@sanity/client'

          const batchDir = 'migration/sanity-batches'
          const sourceRows = fs.readdirSync(batchDir)
            .filter(name => /^batch-\d+\.json$/.test(name))
            .sort()
            .flatMap(name => JSON.parse(fs.readFileSync(path.join(batchDir, name), 'utf8')))

          const sourceBySlug = new Map(sourceRows.map(row => [row.slug.current, row]))
          const client = createClient({
            projectId: process.env.VITE_SANITY_PROJECT_ID,
            dataset: process.env.VITE_SANITY_DATASET,
            token: process.env.SANITY_AUTH_TOKEN,
            apiVersion: '2025-02-19',
            useCdn: false,
            perspective: 'raw',
          })

          const published = await client.fetch(`*[_type == "post" && !(_id in path("drafts.**"))]{
            _id,
            title,
            "slug": slug.current,
            description,
            language,
            duration,
            publishedAt,
            canonicalURL,
            coverUrl,
            legacyBodyHtml,
            "categories": categories[]->slug.current
          }`)

          if (published.length !== 86) {
            console.error('published_count=', published.length)
            process.exit(1)
          }

          const fields = ['title','description','language','duration','publishedAt','canonicalURL','coverUrl','legacyBodyHtml']
          const problems = []
          for (const doc of published) {
            const src = sourceBySlug.get(doc.slug)
            if (!src) {
              problems.push({slug: doc.slug, problem: 'missing_from_source'})
              continue
            }
            for (const field of fields) {
              if ((doc[field] ?? null) !== (src[field] ?? null)) {
                problems.push({slug: doc.slug, field, problem: 'source_mismatch'})
              }
            }
            if (!Array.isArray(doc.categories) || doc.categories.length === 0) {
              problems.push({slug: doc.slug, field: 'categories', problem: 'missing_category'})
            }
          }

          if (problems.length) {
            console.error('PUBLISHED_INTEGRITY_PROBLEMS')
            console.error(JSON.stringify(problems, null, 2))
            process.exit(1)
          }

          console.log('PUBLISHED_INTEGRITY_OK: 86 published articles match canonical source')
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: vitacerta-astro-preview-86
          path: dist
          retention-days: 3
