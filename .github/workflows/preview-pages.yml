name: Build preview Astro

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/preview-pages.yml"

jobs:
  preview:
    runs-on: ubuntu-latest
    env:
      VITE_SANITY_PROJECT_ID: 1dh7sg5j
      VITE_SANITY_DATASET: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
      - run: npm ci
      - run: npm run build
      - name: Prepare isolated project preview
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          base = '/VitaCerta-Astro'
          for p in Path('dist').rglob('*.html'):
              s = p.read_text(encoding='utf-8')
              if '<head>' in s and 'name="robots"' not in s:
                  s = s.replace('<head>', '<head><meta name="robots" content="noindex,nofollow">', 1)
              s = re.sub(r'((?:href|src)=["\'])/(?!/)', rf'\1{base}/', s)
              p.write_text(s, encoding='utf-8')
          for p in Path('dist').rglob('*.css'):
              s = p.read_text(encoding='utf-8')
              s = re.sub(r'url\((["\']?)/(?!/)', rf'url(\1{base}/', s)
              p.write_text(s, encoding='utf-8')
          PY
      - name: Validate pilot pages
        run: |
          test -f dist/index.html
          test -f dist/pt-BR/index.html
          grep -q 'noindex,nofollow' dist/index.html
          HEART="dist/pt-BR/blog/10-habitos-simples-para-cuidar-do-coracao-todos-os-dias/index.html"
          STRESS="dist/pt-BR/blog/16-alimentos-que-ajudam-a-aliviar-o-estresse-com-respaldo-cientifico/index.html"
          NURSING="dist/pt-BR/blog/a-importancia-da-enfermagem-dentro-do-sistema-de-saude/index.html"
          test -f "$HEART"
          test -f "$STRESS"
          test -f "$NURSING"
          grep -q '10 hábitos simples para cuidar do coração todos os dias' "$HEART"
          grep -q '16 alimentos que ajudam a aliviar o estresse' "$STRESS"
          grep -q 'A Importância da Enfermagem Dentro do Sistema de Saúde' "$NURSING"
      - uses: actions/upload-artifact@v4
        with:
          name: vitacerta-astro-preview
          path: dist
          retention-days: 3
