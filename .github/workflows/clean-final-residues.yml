name: Clean final migrated residues

permissions:
  contents: write

on:
  push:
    paths:
      - ".github/workflows/clean-final-residues.yml"

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clean audited residues
        run: |
          set -euo pipefail
          for f in \
            src/content/posts/migrados/creatina-como-escolher-a-melhor-e-quanto-realmente-voce-precisa.md \
            src/content/posts/migrados/longevidade-os-habitos-que-realmente-aumentam-os-anos-de-vida-com-saude.md
          do
            python scripts/sanitize_blogger_html.py < "$f" > "$f.tmp"
            mv "$f.tmp" "$f"
          done

          python - <<'PY'
          from pathlib import Path
          p = Path('src/content/posts/migrados/ferro-para-que-serve-sinais-de-deficiencia-e-por-que-as-mulheres-sao-as-mais-afetadas.md')
          s = p.read_text(encoding='utf-8')
          old = 'https://vitacerta.blogspot.com/2026/08/magnesio-para-que-serve.html'
          new = '/conteudos/magnesio-para-que-serve-sinais-de-deficiencia-e-quando-vale-suplementar/'
          if old not in s:
              raise SystemExit('Link Blogger esperado nao encontrado no artigo de ferro')
          p.write_text(s.replace(old, new), encoding='utf-8')
          PY

      - name: Commit cleanup
        run: |
          set -euo pipefail
          git config user.name "vitacerta"
          git config user.email "vitacerta67@gmail.com"
          git add src/content/posts/migrados
          git commit -m "Corrige residuos finais da migracao Blogger"
          git push
