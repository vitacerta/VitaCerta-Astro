name: Audit final Blogger migration

on:
  push:
    paths:
      - ".github/workflows/clean-final-residues.yml"

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Audit migrated articles
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, sys

          root = Path('src/content/posts/migrados')
          files = sorted(root.glob('*.md'))
          blogger = re.compile(r'https?://(?:www\.)?vitacerta\.blogspot\.com/', re.I)
          legacy = re.compile(
              r'(?:^|;)\s*(?:color|background(?:-color)?|font-(?:family|size|weight|style|feature-settings|kerning|optical-sizing|variant(?:-[\w-]+)?|width)|font-size-adjust|line-height|-webkit-text-stroke-(?:color|width)|-webkit-text-size-adjust)\s*:',
              re.I,
          )
          style = re.compile(r'\sstyle=("[^"]*"|\'[^\']*\')', re.I)

          bad_links = []
          bad_styles = []
          for p in files:
              text = p.read_text(encoding='utf-8')
              for m in blogger.finditer(text):
                  bad_links.append((p.name, m.start()))
              for sm in style.finditer(text):
                  value = sm.group(1)[1:-1]
                  if legacy.search(value):
                      bad_styles.append((p.name, value[:180]))

          print(f'ARTICLE_COUNT={len(files)}')
          print(f'BLOGGER_INTERNAL_LINKS={len(bad_links)}')
          print(f'LEGACY_STYLE_ATTRS={len(bad_styles)}')
          if bad_links:
              print('BAD_LINK_FILES=' + ','.join(sorted({x[0] for x in bad_links})))
          if bad_styles:
              print('BAD_STYLE_FILES=' + ','.join(sorted({x[0] for x in bad_styles})))

          if len(files) != 86 or bad_links or bad_styles:
              sys.exit(1)
          PY
