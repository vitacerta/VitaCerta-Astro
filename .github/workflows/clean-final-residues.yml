name: Clean final migrated residues

on:
  push:
    paths:
      - ".github/workflows/clean-final-residues.yml"

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Print exact residue contexts
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          files = [
            Path('src/content/posts/migrados/ferro-para-que-serve-sinais-de-deficiencia-e-por-que-as-mulheres-sao-as-mais-afetadas.md'),
            Path('src/content/posts/migrados/creatina-como-escolher-a-melhor-e-quanto-realmente-voce-precisa.md'),
            Path('src/content/posts/migrados/longevidade-os-habitos-que-realmente-aumentam-os-anos-de-vida-com-saude.md'),
          ]
          pats = [
            re.compile(r'https?://(?:www\.)?vitacerta\.blogspot\.com/[^\s"\'<>]*', re.I),
            re.compile(r'style=["\'][^"\']*(?:color|background(?:-color)?|font-(?:family|size|weight|style)|line-height)\s*:[^"\']*["\']', re.I),
          ]
          for p in files:
            s=p.read_text(encoding='utf-8')
            print('FILE='+p.name)
            for pat in pats:
              for m in pat.finditer(s):
                a=max(0,m.start()-180); b=min(len(s),m.end()+180)
                print('MATCH='+s[a:b].replace('\n',' '))
          PY
