name: Audit generated Astro site

# One-shot audit of generated public routes and demo exposure after route cleanup.
on:
  push:
    paths:
      - ".github/workflows/audit-generated-site.yml"

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "11.3.0"
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm run build
      - name: Audit dist
        run: |
          python - <<'PY'
          from pathlib import Path
          import sys

          dist = Path('dist')
          required = [
            'index.html',
            'conteudos/index.html',
            'saude/index.html',
            'nutricao/index.html',
            'movimento/index.html',
            'mente/index.html',
            'longevidade/index.html',
            'sobre/index.html',
          ]
          missing = [p for p in required if not (dist / p).exists()]
          article_pages = list((dist / 'conteudos').glob('*/index.html')) if (dist/'conteudos').exists() else []
          nested_migrados = list((dist / 'conteudos' / 'migrados').glob('*/index.html')) if (dist/'conteudos'/'migrados').exists() else []
          sitemap_files = sorted(p.name for p in dist.glob('sitemap*'))

          demo_markers = [
            'AstroPaper', 'How to use AstroPaper', 'Adding new posts',
            'Markdown Style Guide', 'Dynamic OG image', 'How to configure AstroPaper'
          ]
          demo_hits = []
          html_files = list(dist.rglob('*.html'))
          for p in html_files:
            text = p.read_text(encoding='utf-8', errors='ignore')
            for marker in demo_markers:
              if marker.lower() in text.lower():
                demo_hits.append((str(p.relative_to(dist)), marker))

          print('MISSING_REQUIRED=' + (','.join(missing) if missing else '0'))
          print('ARTICLE_PAGES=' + str(len(article_pages)))
          print('NESTED_MIGRADOS=' + str(len(nested_migrados)))
          print('SITEMAPS=' + (','.join(sitemap_files) if sitemap_files else '0'))
          print('POSTS_ROUTE_EXISTS=' + str((dist/'posts').exists()))
          print('ARCHIVES_EXISTS=' + str((dist/'archives').exists()))
          print('TAGS_EXISTS=' + str((dist/'tags').exists()))
          print('DEMO_HITS=' + str(len(demo_hits)))
          if demo_hits:
            for hit in demo_hits[:50]:
              print('DEMO=' + hit[0] + ' :: ' + hit[1])

          if missing or len(article_pages) != 86 or nested_migrados or not sitemap_files or demo_hits:
            sys.exit(1)
          PY
