name: Repair first Blogger batch

permissions:
  contents: write

on:
  push:
    paths:
      - ".github/workflows/repair-first-batch.yml"

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reimport exact first batch from Blogger
        env:
          BATCH_SLUGS: "esquecimento-falta-de-foco-e-dificuldade-para-aprender-7-habitos-simples-que-ajudam-a-cuid,menopausa-o-que-mudou-nos-tratamentos-e-quais-opcoes-existem-hoje,guia-definitivo-dos-efeitos-colaterais-do-ozempic-como-aliviar-sintomas-e-proteger-os-musc,tdah-em-adultos-por-que-tantos-diagnosticos-chegam-so-depois-dos-30,longevidade-os-habitos-que-realmente-aumentam-os-anos-de-vida-com-saude,efervescencia-coletiva-por-que-viver-experiencias-em-grupo-faz-tao-bem-para-a-sua-saude-me,vitaminas-depois-dos-40-o-que-realmente-vale-a-pena-suplementar,passou-dos-40-e-esta-muito-tempo-sentado-o-que-caminhar-todos-os-dias-pode-mudar-na-sua-sa,cancer-de-mama-o-medo-que-afastou-mulheres-da-reposicao-hormonal-por-20-anos,dor-nas-costas-no-home-office-o-que-realmente-ajuda-alem-de-ajustar-a-postura"
        run: python scripts/import_blogger_batch.py

      - name: Commit repaired articles
        run: |
          set -euo pipefail
          git config user.name "vitacerta"
          git config user.email "vitacerta67@gmail.com"
          git add src/content/posts/migrados
          if git diff --cached --quiet; then
            echo "No article changes required."
            exit 0
          fi
          git commit -m "Restaura fidelidade do primeiro lote Blogger"
          git push
