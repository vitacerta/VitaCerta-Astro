name: Import Blogger batch

permissions:
  contents: write

on:
  push:
    paths:
      - ".github/workflows/import-blogger-batch.yml"

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Import selected Blogger posts
        env:
          BATCH_SLUGS: >-
            por-que-sinto-tanto-sono-depois-do-almoco-e-como-evitar-a-lerdeza,
            creatina-como-escolher-a-melhor-e-quanto-realmente-voce-precisa,
            por-que-minhas-pernas-parecem-pesadas-no-fim-do-dia-cansaco-ou-circulacao,
            o-que-significa-aquela-pontada-no-peito-que-surge-quando-voce-respira-fundo,
            dieta-vegetariana-o-que-acontece-com-a-saude-quando-a-carne-sai-do-prato,
            depressao-tambem-doi-no-corpo-os-sintomas-fisicos-que-muita-gente-nao-reconhece,
            nutricionista-alimentando-vidas-promovendo-saude,
            dieta-dash-a-alimentacao-criada-para-ajudar-a-controlar-a-pressao-arterial,
            zinco-o-mineral-esquecido-que-ajuda-na-imunidade-e-na-cicatrizacao,
            calvicie-nao-e-so-estetica-o-que-ela-pode-revelar-sobre-sua-saude-hormonal
        run: |
          BATCH_SLUGS="$(printf '%s' "$BATCH_SLUGS" | tr -d '[:space:]')"
          export BATCH_SLUGS
          python scripts/import_blogger_batch.py

      - name: Commit imported posts
        run: |
          set -euo pipefail
          git config user.name "vitacerta"
          git config user.email "vitacerta67@gmail.com"
          git add src/content/posts/migrados
          if git diff --cached --quiet; then
            echo "No article changes required."
            exit 0
          fi
          git commit -m "Importa segundo lote ampliado de 10 artigos"
          git push
