name: Import Blogger batch

permissions:
  contents: write

on:
  push:
    paths:
      - ".github/workflows/import-blogger-batch.yml"

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Import next pending Blogger posts
        env:
          BATCH_LIMIT: "10"
        run: python scripts/import_blogger_batch.py

      - name: Commit imported posts
        run: |
          set -euo pipefail
          git config user.name "vitacerta"
          git config user.email "vitacerta67@gmail.com"
          git add src/content/posts/migrados
          if git diff --cached --quiet; then
            echo "No article changes required."
            exit 0
          fi
          git commit -m "Importa quinto lote ampliado de 10 artigos"
          git push
