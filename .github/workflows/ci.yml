name: CI

permissions:
  contents: read

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - edited
      - synchronize
      - reopened
  workflow_call:

jobs:
  build:
    name: Build validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VITE_SANITY_PROJECT_ID: 1dh7sg5j
      VITE_SANITY_DATASET: production
      SANITY_PREVIEW: "false"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Verify production output
        run: |
          test -f dist/conteudos/index.html
          test "$(find dist/conteudos -mindepth 2 -type f -name index.html | wc -l)" -eq 86
          grep -q 'https://vitacerta.com.br/' dist/index.html
          if grep -q 'noindex,nofollow' dist/index.html; then
            echo 'ERRO: noindex encontrado na home de produção'
            exit 1
          fi
