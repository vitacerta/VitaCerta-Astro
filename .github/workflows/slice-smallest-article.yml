name: Prepara menor artigo teste Sanity

on:
  push:
    branches: [fyrre-base]
    paths:
      - '.github/workflows/slice-smallest-article.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  slice:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fyrre-base
      - name: Extrair menor artigo completo
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          rows = json.loads(Path('migration/vitacerta-posts.json').read_text(encoding='utf-8'))
          row = min(rows, key=lambda r: len(r.get('bodyHtml','')))
          Path('migration/test-smallest-article.json').write_text(json.dumps(row, ensure_ascii=False, indent=2), encoding='utf-8')
          print(row['slug'], len(row.get('bodyHtml','')))
          PY
      - name: Commitar menor artigo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add migration/test-smallest-article.json
          git commit -m "Extrai menor artigo para teste completo Sanity" || exit 0
          git push origin HEAD:fyrre-base
